<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1536" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="sea" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#c8dcea"/>
      <stop offset="1" stop-color="#8db1c9"/>
    </linearGradient>
    <linearGradient id="land" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8ddb5"/>
      <stop offset="1" stop-color="#c9b989"/>
    </linearGradient>
    <linearGradient id="hills" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#8fa17d"/>
      <stop offset="1" stop-color="#6d8863"/>
    </linearGradient>
    <pattern id="waves" width="60" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 15 Q 15 5 30 15 T 60 15" fill="none" stroke="#a5c3d6" stroke-width="1.2" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Sea -->
  <rect width="2048" height="1536" fill="url(#sea)"/>
  <rect width="2048" height="1536" fill="url(#waves)" opacity="0.35"/>

  <!-- Landmass (North Goa coastline, stylised, west of longitude ~73.78) -->
  <path
    d="M 2048 0
       L 2048 1536
       L 950 1536
       Q 900 1440 940 1360
       Q 1000 1280 1020 1210
       Q 1000 1140 1050 1080
       Q 1120 1020 1100 950
       Q 1080 880 1140 820
       Q 1200 760 1170 700
       Q 1130 640 1180 570
       Q 1230 500 1200 430
       Q 1150 360 1200 300
       Q 1260 240 1220 180
       Q 1170 120 1230 60
       Q 1290 20 1350 0
       Z"
    fill="url(#land)"
  />

  <!-- Chapora river (mouth around Morjim, curving inland) -->
  <path
    d="M 1085 950 Q 1200 940 1330 900 Q 1460 850 1560 780 Q 1660 720 1780 700"
    fill="none" stroke="#8db1c9" stroke-width="26" stroke-linecap="round" opacity="0.85"
  />
  <path
    d="M 1085 950 Q 1200 940 1330 900 Q 1460 850 1560 780 Q 1660 720 1780 700"
    fill="none" stroke="#a5c3d6" stroke-width="14" stroke-linecap="round" opacity="0.9"
  />

  <!-- Baga river (Baga creek south of the villa) -->
  <path
    d="M 1000 1210 Q 1150 1180 1280 1160 Q 1420 1150 1560 1120"
    fill="none" stroke="#a5c3d6" stroke-width="10" opacity="0.7"
  />

  <!-- Inland hills / paddy blocks -->
  <g fill="url(#hills)" opacity="0.75">
    <path d="M 1440 320 Q 1520 260 1600 320 Q 1680 380 1600 440 Q 1520 500 1440 440 Z"/>
    <path d="M 1620 520 Q 1720 460 1820 520 Q 1900 580 1820 640 Q 1720 700 1620 640 Z"/>
    <path d="M 1500 780 Q 1600 720 1700 780 Q 1780 840 1700 900 Q 1600 950 1500 890 Z"/>
    <path d="M 1780 940 Q 1880 880 1980 940 Q 2040 990 1980 1040 Q 1880 1090 1780 1040 Z"/>
  </g>

  <!-- Coastal roads (dashed brown) -->
  <path
    d="M 1075 200 Q 1120 400 1080 600 Q 1050 800 1080 990 Q 1100 1180 1100 1360"
    fill="none" stroke="#7a5f3d" stroke-width="4" stroke-dasharray="10 8" opacity="0.65"
  />
  <path
    d="M 1075 200 L 1400 260 L 1700 320 L 1920 400"
    fill="none" stroke="#7a5f3d" stroke-width="3" stroke-dasharray="8 6" opacity="0.55"
  />
  <path
    d="M 1100 990 L 1400 1000 L 1700 1060 L 1970 1120"
    fill="none" stroke="#7a5f3d" stroke-width="3" stroke-dasharray="8 6" opacity="0.55"
  />

  <!-- Beach shoreline highlight -->
  <path
    d="M 950 1536 Q 900 1440 940 1360
       Q 1000 1280 1020 1210
       Q 1000 1140 1050 1080
       Q 1120 1020 1100 950
       Q 1080 880 1140 820
       Q 1200 760 1170 700
       Q 1130 640 1180 570
       Q 1230 500 1200 430
       Q 1150 360 1200 300
       Q 1260 240 1220 180
       Q 1170 120 1230 60
       Q 1290 20 1350 0"
    fill="none" stroke="#f2e6c0" stroke-width="14"
  />

  <!-- Palm-tree cluster silhouettes (no text) -->
  <g fill="#4a7454" opacity="0.55">
    <circle cx="1120" cy="440" r="10"/>
    <circle cx="1130" cy="620" r="9"/>
    <circle cx="1090" cy="800" r="10"/>
    <circle cx="1140" cy="1100" r="9"/>
    <circle cx="1080" cy="1300" r="10"/>
  </g>
</svg>
