<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500;600&display=swap">
  <style>
    body { margin: 0; background: #FBF9F5; font-family: "Jost", system-ui, sans-serif; color: #1B1A17; -webkit-font-smoothing: antialiased; }
    a { color: #8A6B3A; text-decoration: none; } a:hover { color: #6E5430; }
    .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #8A8377; }
    .stop { cursor: pointer; transition: opacity .28s ease; }

    /* entry: illustrations rise in */
    .place { opacity: 0; transform-box: fill-box; transform-origin: 50% 100%;
             animation: rise .5s cubic-bezier(.2,.85,.25,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.86) } to { opacity: 1; transform: none } }
    .lab { opacity: 0; animation: fade .4s ease forwards; }
    @keyframes fade { to { opacity: 1 } }

    /* entry: dotted lines draw out from the villa */
    .rev { animation: rev .9s cubic-bezier(.3,.7,.3,1) forwards; }
    @keyframes rev { to { stroke-dashoffset: 0 } }

    .d0 { animation-delay: .10s } .d1 { animation-delay: .46s } .d2 { animation-delay: .64s }
    .d3 { animation-delay: .82s } .d4 { animation-delay: 1s }   .d5 { animation-delay: 1.18s }
    .d6 { animation-delay: 1.36s }
    .v1 { animation-delay: .54s } .v2 { animation-delay: .72s } .v3 { animation-delay: .90s }
    .v4 { animation-delay: 1.08s } .v5 { animation-delay: 1.26s } .v6 { animation-delay: 1.44s }
    .n1 { animation-delay: 1.30s } .n2 { animation-delay: 1.48s } .n3 { animation-delay: 1.66s }
    .n4 { animation-delay: 1.84s } .n5 { animation-delay: 2.02s } .n6 { animation-delay: 2.20s }

    /* idle life */
    .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 6s ease-in-out infinite; }
    @keyframes sway { 0%,100% { transform: rotate(-2deg) } 50% { transform: rotate(2.2deg) } }
    .bob { transform-box: fill-box; transform-origin: 50% 100%; animation: bob 4.5s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0) rotate(-1deg) } 50% { transform: translateY(-3px) rotate(1.2deg) } }
    .flutter { transform-box: fill-box; transform-origin: 0% 50%; animation: flutter 3s ease-in-out infinite; }
    @keyframes flutter { 0%,100% { transform: scaleX(1) } 50% { transform: scaleX(.72) } }
    .shine { animation: shine 5s ease-in-out infinite; }
    @keyframes shine { 0%,100% { opacity: .5 } 50% { opacity: .9 } }

    @media (prefers-reduced-motion: reduce) {
      .place, .lab, .rev, .sway, .bob, .flutter, .shine { animation: none !important; opacity: 1; transform: none; stroke-dashoffset: 0 !important; }
    }
  </style>
</helmet>

<script data-dc-script data-props='{"$preview":{"width":1000,"height":620}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: null };
  }
  renderVals() {
    const stops = [
      { name: 'Ashwem Beach', meta: 'Day 1 · Afternoon · 5.1 km from the villa',
        copy: 'The wide, flat one where the crowd thins after four. Park at the shack end and walk left for twenty minutes.' },
      { name: 'Chapora Fort', meta: 'Day 1 · Sunset · 7.4 km from the villa',
        copy: 'Ten minutes uphill on loose stone. The river mouth goes gold about twenty minutes before the sun drops.' },
      { name: 'Mapusa Market', meta: 'Day 4 · Morning · 6.8 km from the villa',
        copy: 'Friday only, and go before eleven. Chorizo at the back row, bebinca from the stall by the bus stand.' },
      { name: "Bomra's, Candolim", meta: 'Day 1 · Dinner · 9.2 km from the villa',
        copy: 'Burmese, small, booked out by Thursday. The tea leaf salad is the one to order.' },
      { name: 'Mandovi sunset sail', meta: 'Day 2 · Sunset · 14.1 km from the villa',
        copy: 'Two hours out, small boat, no music. Life jackets that actually fit a four-year-old.' },
      { name: 'Basilica, Old Goa', meta: 'Day 3 · Morning · 21.4 km from the villa',
        copy: 'Go at opening, before the coaches. The side chapel stays cool and is almost always empty.' },
    ];
    const sel = this.state.sel;
    const dim = (i) => (sel === null || sel === i ? '1' : '0.32');
    const pick = (i) => () => this.setState({ sel: this.state.sel === i ? null : i });
    const s = sel === null ? null : stops[sel];
    return {
      o1: dim(0), o2: dim(1), o3: dim(2), o4: dim(3), o5: dim(4), o6: dim(5),
      pick1: pick(0), pick2: pick(1), pick3: pick(2), pick4: pick(3), pick5: pick(4), pick6: pick(5),
      clear: () => this.setState({ sel: null }),
      hasSel: sel !== null,
      cardName: s ? s.name : '',
      cardMeta: s ? s.meta : '',
      cardCopy: s ? s.copy : '',
    };
  }
}
</script>
